name: Comment on pull request

# Posts the summary of "Check pull request". It runs from the default branch with a token that can comment, and only
# reads two text files from the artifact: it never runs anything that comes from the pull request.
on:
  workflow_run:
    workflows: ["Check pull request"]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download the summary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-summary
          path: summary
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(tr -dc '0-9' < summary/number.txt)
          [ -n "$number" ] || { echo "no pull request number"; exit 1; }
          # Cut it short, and keep a name in the summary from mentioning anybody.
          head -c 4000 summary/summary.md | sed 's/@/@\xe2\x80\x8b/g' > body.md
          gh pr comment "$number" --edit-last --create-if-none --body-file body.md
