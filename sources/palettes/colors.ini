; Palettes: every colour-only scheme of Ampify in one theme. The shapes come from user.css and its settings, the
; same for every scheme; each section below only changes the colours. A name says the family, then how it looks.
; Each key replaces the brush of the same name in the app and serves as $name in user.css.
;
; Catppuccin, by the Catppuccin community (MIT, https://github.com/catppuccin/catppuccin).
; Dracula, the official palette (MIT, https://github.com/dracula/dracula-theme).
; Tokyo Night, after tokyonight.nvim (MIT, https://github.com/folke/tokyonight.nvim); Day darkens the blue and the text a little.
; Rose Pine (MIT, https://github.com/rose-pine/rose-pine-theme); Dawn darkens the iris a little.
; Nord (MIT, https://github.com/nordtheme/nord); Snow Storm darkens the frost blue a little.
; Gruvbox (MIT, https://github.com/morhetz/gruvbox).
; Comfy and Mono: palettes of Ampify, after the idea of Spicetify's Comfy theme.

