; Palettes: one calm layout, one scheme per colour family. The shapes come from user.css and its settings, the
; same for every scheme; each section below only changes the colours. Each key replaces the brush of the same name in
; the app and serves as $name in user.css.
;
; Catppuccin: Mocha, then Macchiato, Frappé and Latte (light), by the Catppuccin community (MIT,
;   https://github.com/catppuccin/catppuccin).
; Tokyo Night: Night, after tokyonight.nvim (MIT, https://github.com/folke/tokyonight.nvim).
; Rose Pine: the main variant (MIT, https://github.com/rose-pine/rose-pine-theme).
; Nord: Polar Night (MIT, https://github.com/nordtheme/nord).
; Gruvbox: dark (MIT, https://github.com/morhetz/gruvbox).
; Dracula: the official palette (MIT, https://github.com/dracula/dracula-theme).
; Rose gold and Midnight: palettes of Ampify, warm brown-black with a rose gold accent, and ink blue with moonlight.

