; Glass: smoked glass on a night blue background, cyan accent. Each key replaces the brush of the same name in the app
; and serves as $name in user.css. The first scheme is the default one: both schemes have the same keys.

[Dark]
SolidBackgroundFillColorBaseBrush = 0E1424
ApplicationPageBackgroundThemeBrush = 0E1424
; Layers, cards and controls are a white veil, not a solid blue: on panes tinted by the cover they take its tint.
LayerFillColorDefaultBrush = 0FFFFFFF
CardBackgroundFillColorDefaultBrush = 14FFFFFF
ControlFillColorDefaultBrush = 1AFFFFFF
AccentFillColorDefaultBrush = 4FD1FF
TextFillColorPrimaryBrush = F2F6FF
TextFillColorSecondaryBrush = A8B6D6

[Light]
SolidBackgroundFillColorBaseBrush = E9F0FB
ApplicationPageBackgroundThemeBrush = E9F0FB
LayerFillColorDefaultBrush = F4F8FF
CardBackgroundFillColorDefaultBrush = FFFFFF
ControlFillColorDefaultBrush = FFFFFF
AccentFillColorDefaultBrush = 0078C8
TextFillColorPrimaryBrush = 0E1424
TextFillColorSecondaryBrush = 46536E
