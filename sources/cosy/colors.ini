; Cosy: soft, flat evening colours. Each scheme is one hue in a dark and calm mode, and Linen is the light one. The
; base (SolidBackgroundFillColorBaseBrush) is the deeper shade the sidebar and the window take when the theme is not
; flat; the page (ApplicationPageBackgroundThemeBrush) is the sheet everything sits on. Every text colour reads at 4.5:1
; or more on the page and on the cards. Each key replaces the Fluent brush of the same name and serves as $name in
; user.css.

