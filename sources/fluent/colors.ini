; Fluent: Windows 11's own brushes, as WinUI draws its apps on Mica. PascalCase keys replace the app's brushes; lowercase
; keys are this theme's own, read as $key or var(--spice-<key>). Both schemes have the same keys.
; layer: the content layer over the Mica (-mica-alt, -acrylic: over the other materials, as WinUI's LayerOn* brushes). band: the shelves under an album. stroke: the edge of the layer and of cards.
; edge: the hairline round the floating cards and the bar. bar: the tint of the bar's acrylic.
; control-stroke / -edge: a control's edge and its last pixels (lit at the top in dark, shaded at the bottom in light).
; accent-stroke / -edge: the same for the accent button.

