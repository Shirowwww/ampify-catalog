; Console: graphite hardware, one accent per scheme. Amber is the default: the warm glow of the vacuum-fluorescent and
; backlit displays of studio gear, which reads on graphite without the glare of a saturated green. Green is the VU
; meter, Ice a cold blue-white display. Only the accent and the display's glass change between schemes.
;
; PascalCase keys replace the app's brushes; lowercase keys are this theme's own colours, read by user.css as
; var(--spice-<key>).

